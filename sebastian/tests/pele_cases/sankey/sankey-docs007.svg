<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 600px; background-color: white;" viewBox="0 0 600 400" role="graphics-document document" aria-roledescription="sankey"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#333333;stroke:#333333;}#my-svg .marker.cross{stroke:#333333;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .label{font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .node-labels{font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .sankey-label-bg{stroke:#ECECFF;stroke-width:4px;stroke-linejoin:round;paint-order:stroke;}#my-svg .sankey-label-fg{fill:#333;}#my-svg .node rect{shape-rendering:crispEdges;}#my-svg .link{fill:none;stroke-opacity:0.5;mix-blend-mode:multiply;}#my-svg .node .neo-node{stroke:#9370DB;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#my-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="nodes"><g class="node" id="node-1" transform="translate(0,9.673843260105073)" x="0" y="9.673843260105073"><rect height="376.00000000000006" width="10" fill="#4e79a7"/></g><g class="node" id="node-2" transform="translate(590,0)" x="590" y="0"><rect height="83.42270309921143" width="10" fill="#4e79a7"/></g><g class="node" id="node-3" transform="translate(590,95.42270309921143)" x="590" y="95.42270309921143"><rect height="250.99211443242257" width="10" fill="#e15759"/></g><g class="node" id="node-4" transform="translate(590,358.414817531634)" x="590" y="358.414817531634"><rect height="41.58518246836604" width="10" fill="#bab0ab"/></g></g><g class="node-labels" font-size="14"><text x="16" y="197.6738432601051" dy="0.35em" text-anchor="start">Electricity grid</text><text x="584" y="41.711351549605716" dy="0.35em" text-anchor="end">Heating and cooling - homes</text><text x="584" y="220.91876031542273" dy="0.35em" text-anchor="end">Industry</text><text x="584" y="379.20740876581704" dy="0.35em" text-anchor="end">Losses</text></g><g class="links" fill="none" stroke-opacity="0.5"><g class="link" style="mix-blend-mode: multiply;"><linearGradient id="linearGradient-5" gradientUnits="userSpaceOnUse" x1="10" x2="590"><stop offset="0%" stop-color="#4e79a7"/><stop offset="100%" stop-color="#4e79a7"/></linearGradient><path d="M10,51.3851948