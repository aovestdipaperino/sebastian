<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 450" style="max-width: 800px; background-color: white;" role="graphics-document document" aria-roledescription="venn"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#333333;stroke:#333333;}#my-svg .marker.cross{stroke:#333333;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .venn-title{font-size:32px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .venn-circle text{font-size:48px;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .venn-intersection text{font-size:48px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#my-svg .venn-text-node{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#333;}#my-svg .node .neo-node{stroke:#9370DB;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#my-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(0, 0)"><g class="venn-area venn-circle venn-set-0" data-venn-sets="A"><path d="M 205.59405940594056 225 &#10;m -190.59405940594056 0 &#10;a 190.59405940594056 190.59405940594056 0 1 0 381.1881188118811 0 &#10;a 190.59405940594056 190.59405940594056 0 1 0 -381.1881188118811 0" style="fill-opacity: 0.1; fill: rgb(255, 0, 128); stroke: rgb(255, 0, 128); stroke-width: 2.5; stroke-opacity: 0.95;"/><text class="label" text-anchor="middle" dy=".35em" x="205" y="225" style="fill: rgb(102, 0, 51); font-size: 24px;"><tspan x="205" y="225" dy="0.35em">A</tspan></text></g><g class="venn-area venn-circle venn-set-1" data-venn-sets="B"><path d="M 594.4059405940594 225 &#10;m -190.59405940594056 0 &#10;a 190.59405940594056 190.59405940594056 0 1 0 381.1881188118811 0 &#10;a 190.59405940594056 190.59405940594056 0 1 0 -381.1881188118811 0" style="fill-opacity: 0.1; fill: rgba(255, 0, 128, 0.5); stroke: rgba(255, 0, 128, 0.5); stroke-width: 2.5; stroke-opacity: 0.95;"/><text class="label" text-anchor="middle" dy=".35em" x="594" y="225" style="fill: rgba(102, 0, 51, 0.5); font-size: 24px;"><tspan x="594" y="225" dy="0.35em">B</tspan></text></g></g></svg>