<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" style="max-width: 134.912px; background-color: white;" viewBox="-20 194 134.9124984741211 112" role="graphics-document document" aria-roledescription="ishikawa"><style>#my-svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#552222;}#my-svg .error-text{fill:#552222;stroke:#552222;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#333333;stroke:#333333;}#my-svg .marker.cross{stroke:#333333;}#my-svg svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .ishikawa .ishikawa-spine,#my-svg .ishikawa .ishikawa-branch,#my-svg .ishikawa .ishikawa-sub-branch{stroke:#333333;stroke-width:2;fill:none;}#my-svg .ishikawa .ishikawa-sub-branch{stroke-width:1;}#my-svg .ishikawa .ishikawa-arrow{fill:#333333;}#my-svg .ishikawa .ishikawa-head{fill:#ECECFF;stroke:#333333;stroke-width:2;}#my-svg .ishikawa .ishikawa-label-box{fill:#ECECFF;stroke:#333333;stroke-width:2;}#my-svg .ishikawa text{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}#my-svg .ishikawa .ishikawa-head-label{font-weight:600;text-anchor:middle;dominant-baseline:middle;font-size:14px;}#my-svg .ishikawa .ishikawa-label{text-anchor:end;}#my-svg .ishikawa .ishikawa-label.cause{text-anchor:middle;dominant-baseline:middle;}#my-svg .ishikawa .ishikawa-label.align{text-anchor:end;dominant-baseline:middle;}#my-svg .ishikawa .ishikawa-label.up{dominant-baseline:baseline;}#my-svg .ishikawa .ishikawa-label.down{dominant-baseline:hanging;}#my-svg .node .neo-node{stroke:#9370DB;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#my-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g class="ishikawa"><defs><marker id="ishikawa-arrow-my-svg" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 10 0 L 0 5 L 10 10 Z" class="ishikawa-arrow"/></marker></defs><line class="ishikawa-spine" x1="0" y1="250" x2="0" y2="250"/><g class="ishikawa-head-group" transform="translate(0,250)"><path class="ishikawa-head" d="M 0 -36 L 0 36 Q 189.825 0 0 -36 Z"/><text class="ishikawa-head-label" text-anchor="start" x="0" y="0" transform="translate(42.546875,1.34375)"><tspan x="0" dy="0">Only effect</tspan></text></g></g></svg>